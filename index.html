function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function nowHHMM(){return new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false})}
function dayOfYear(){const d=new Date(),s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/86400000)}
function formatPhone(v){let d=String(v||"").replace(/\D/g,"");if(d.length===10&&d.startsWith("10"))d="0"+d;if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3");return d}
function resetDailyIfNeeded(){if(localStorage.getItem(DATE_KEY)!==todayKey()){[ACTION_KEY,IN_TIME_KEY,OUT_TIME_KEY].forEach(k=>localStorage.removeItem(k));localStorage.setItem(DATE_KEY,todayKey())}}
function setStatus(t,k=""){const e=document.getElementById("msg");e.textContent=t;e.className="status"+(k?" "+k:"")}
function updateClock(){const d=new Date(),days=["일","월","화","수","목","금","토"];document.getElementById("clock").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]}) · ${d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}`}
function updateBtn(){resetDailyIfNeeded();const last=localStorage.getItem(ACTION_KEY),i=document.getElementById("inBtn"),o=document.getElementById("outBtn"),it=localStorage.getItem(IN_TIME_KEY)||"",ot=localStorage.getItem(OUT_TIME_KEY)||"";document.getElementById("inTime").textContent=it||"--:--";document.getElementById("outTime").textContent=ot||"--:--";i.textContent="출근";o.textContent="퇴근";if(!last){i.disabled=false;o.disabled=true;setStatus("아직 출근 전입니다.")}else if(last==="출근"){i.disabled=true;o.disabled=false;setStatus("✓ "+it+" 출근 완료","ok")}else{i.disabled=true;o.disabled=true;setStatus("✓ "+ot+" 퇴근 완료","ok")}}
function showMain(u){document.getElementById("register").style.display="none";document.getElementById("main").style.display="block";document.getElementById("userName").textContent=u.name;document.getElementById("userPhone").textContent="· "+formatPhone(u.phone);document.getElementById("quoteText").textContent=DAILY_QUOTES[(dayOfYear()-1)%365];updateClock();setInterval(updateClock,30000);updateBtn()}
window.onload=()=>{resetDailyIfNeeded();document.getElementById("phone").oninput=function(){this.value=formatPhone(this.value)};const s=localStorage.getItem(KEY);if(s)showMain(JSON.parse(s))}
async function register(){const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),m=document.getElementById("regMsg");m.style.display="block";if(!name||!phone){m.textContent="이름과 전화번호를 입력하세요.";return}m.textContent="직원 등록 중...";try{await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"register",name,phone,userAgent:navigator.userAgent})});const u={name,phone:phone.replace(/\D/g,"")};localStorage.setItem(KEY,JSON.stringify(u));showMain(u)}catch(e){m.textContent="직원 등록 중 오류가 발생했습니다."}}
function getLocation(){return new Promise(r=>{if(!navigator.geolocation)return r({latitude:"",longitude:"",distance:""});navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;r({latitude:lat,longitude:lng,distance:Math.round(calculateDistanceMeters(lat,lng,STORE_LAT,STORE_LNG))+"m"})},()=>r({latitude:"",longitude:"",distance:"위치권한없음"}),{enableHighAccuracy:false,timeout:5000,maximumAge:60000})})}
async function send(type){const u=JSON.parse(localStorage.getItem(KEY)||"null");if(!u)return setStatus("직원 정보를 다시 등록해주세요.","error");const i=document.getElementById("inBtn"),o=document.getElementById("outBtn"),t=nowHHMM();localStorage.setItem(type==="출근"?IN_TIME_KEY:OUT_TIME_KEY,t);document.getElementById(type==="출근"?"inTime":"outTime").textContent=t;(type==="출근"?i:o).textContent=type+" 저장중...";i.disabled=o.disabled=true;setStatus(type+" "+t+" · 저장 중...");const loc=await getLocation();try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:u.name,phone:u.phone,type,store:"압구정 길채정",timestamp:new Date().toISOString(),latitude:loc.latitude,longitude:loc.longitude,distance:loc.distance,userAgent:navigator.userAgent})});const result=await res.json();if(!result||result.success!==true)throw new Error();let st=t,m=String(result.time||"").match(/(\d{2}):(\d{2})/);if(m)st=m[1]+":"+m[2];localStorage.setItem(ACTION_KEY,type);localStorage.setItem(type==="출근"?IN_TIME_KEY:OUT_TIME_KEY,st);localStorage.setItem(DATE_KEY,todayKey());updateBtn()}catch(e){localStorage.removeItem(type==="출근"?IN_TIME_KEY:OUT_TIME_KEY);updateBtn();setStatus("저장 실패 · 다시 눌러주세요.","error")}}
function calculateDistanceMeters(a,b,c,d){const R=6371000,x=toRad(c-a),y=toRad(d-b),z=Math.sin(x/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function toRad(v){return v*Math.PI/180}
function reset(){if(!confirm("직원 정보를 다시 등록하시겠습니까?"))return;[KEY,ACTION_KEY,DATE_KEY,IN_TIME_KEY,OUT_TIME_KEY].forEach(k=>localStorage.removeItem(k));location.reload()}
</script></body></html>
